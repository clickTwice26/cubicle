<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Cubicle — an open-source functions platform you run yourself. One stack, your hardware, your data."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Cubicle</title>
    <script>
      // Applied before first paint so the console never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('cubicle-theme')
        var theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
