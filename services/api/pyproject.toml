[project]
name = "cubicle-api"
version = "1.0.0"
description = "Cubicle control plane — API, scheduler and isolate pool manager"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    "docker==7.1.0",
    "prometheus-client==0.21.1",
    "structlog==24.4.0",
    "orjson==3.10.13",
    "python-slugify==8.0.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "anyio==4.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cubicle*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]
# The isolate's /tmp is a tmpfs the control plane attaches, not a host path.
"cubicle/runtime/pool.py" = ["S108", "ASYNC109"]
# The scaffolded handler contains example SQL as a string literal.
"cubicle/templates.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:cubicle.*"]
