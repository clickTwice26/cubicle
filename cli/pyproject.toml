[project]
name = "cubicle-cli"
version = "1.0.0"
description = "Command line client for a self-hosted Cubicle cluster"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
cubicle = "cubicle_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cubicle_cli*"]
